name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_path:
        description: "Optional test file or directory to run instead of the full suite"
        required: false
        default: ""

concurrency:
  # each push to main has its own group and is never cancelled or replaced
  # by a newer push, so every commit on main gets its image
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CACHE_VERSION: v1

jobs:
  no-extra:
    name: No excluded upstream code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/check-no-extra.sh

  assets:
    name: Assets (typecheck, lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: marocchino/tool-versions-action@4219f2e6bfdb4cce482b78f71ad9663e64f4d247 # v2.0.0
        id: versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
      - run: npm ci --prefix ./assets
      - run: npm run typecheck --prefix ./assets
      - run: npm run lint --prefix ./assets
      - run: npm test --prefix ./assets

  test:
    name: "Build and test (ce_test, ${{ matrix.versions.name }}, ${{ matrix.mix_test_partition }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mix_test_partition: [1, 2, 3, 4, 5, 6]
        versions:
          # the versions upstream's CI uses
          - name: upstream
            postgres: "postgres:18"
            clickhouse: "clickhouse/clickhouse-server:25.11.5.8-alpine"
          # the versions this fork is deployed with
          - name: deployed
            postgres: "postgres:16.16"
            clickhouse: "clickhouse/clickhouse-server:26.8.38.9-alpine"
    env:
      MIX_ENV: ce_test
    services:
      postgres:
        image: ${{ matrix.versions.postgres }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: ${{ matrix.versions.clickhouse }}
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: marocchino/tool-versions-action@4219f2e6bfdb4cce482b78f71ad9663e64f4d247 # v2.0.0
        id: versions
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.erlang }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            tracker/node_modules
          key: ${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-${{ hashFiles('**/mix.lock', 'tracker/package-lock.json') }}
          restore-keys: |
            ${{ env.MIX_ENV }}-${{ env.CACHE_VERSION }}-

      - run: npm install --prefix ./tracker
      - run: npm run deploy --prefix ./tracker

      - run: mix deps.get --only $MIX_ENV
      - run: mix compile --warnings-as-errors --all-warnings

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 2
          done
          echo "ClickHouse did not become ready" >&2
          exit 1

      - run: mix do ecto.create, ecto.migrate
      - run: mix run -e "Tzdata.ReleaseUpdater.poll_for_update"

      - name: Test
        if: ${{ !inputs.test_path }}
        run: mix test --include slow --include migrations --max-failures 1 --warnings-as-errors --partitions 6
        env:
          MIX_TEST_PARTITION: ${{ matrix.mix_test_partition }}

      - name: Test (selected path)
        if: ${{ inputs.test_path && matrix.mix_test_partition == 1 }}
        run: mix test --include slow --include migrations --warnings-as-errors "$TEST_PATH"
        env:
          TEST_PATH: ${{ inputs.test_path }}

  docker:
    name: Docker image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MIX_ENV=ce
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}

  # Publishes the container image for deployment. Runs only on pushes to
  # main, after the other jobs pass. The tag is the full commit SHA; there is
  # no mutable tag, so deployments pin the digest shown in the job summary.
  publish:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [no-extra, assets, test, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/muutto365/avora-analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MIX_ENV=ce
            SOURCE_COMMIT=${{ github.sha }}
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo
            echo "\`${IMAGE}:sha-${GITHUB_SHA}\`"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
