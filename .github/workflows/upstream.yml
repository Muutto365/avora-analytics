name: Upstream check

# Reports new upstream release tags and upstream security advisories that
# affect the version recorded in UPSTREAM, in one issue labelled
# `upstream`. It only reads public metadata: no upstream code is fetched
# into this repository. See docs/upstream-upgrades.md for the upgrade
# procedure.

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check upstream releases and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upstream_watch.py
