# Reviewed exceptions to the security gate in .github/workflows/security.yml.
#
# An entry lets a CRITICAL/HIGH finding that has a fix through the gate
# until its review date. Every entry needs:
#   id         advisory id (GHSA, EEF-CVE or CVE; any alias of the finding)
#   package    package name as reported
#   reason     why the fix is not applied yet, and where it is tracked
#   review_by  YYYY-MM-DD, at most 30 days ahead
#
# The gate fails on an entry that is past review_by, more than 30 days
# out, incomplete, or that no longer matches a finding: remove an entry
# in the same pull request that fixes it.
#
# Format: only this flat list shape is accepted (see ghutil.parse_entry_list).

entries:
  - id: EEF-CVE-2026-115693
    package: hackney
    reason: "Fixed only in hackney 4.x (major upgrade, also needs sentry 13); bump in a separate pull request"
    review_by: 2026-12-17
  - id: GHSA-gp9c-pm5m-5cxr
    package: hackney
    reason: "Fixed only in hackney 4.x (major upgrade, also needs sentry 13); bump in a separate pull request"
    review_by: 2026-12-17
  - id: GHSA-655f-mp8p-96gv
    package: req
    reason: "Fixed in req 0.6.1; mix.exs requires ~> 0.5.16, bump in a separate pull request"
    review_by: 2026-12-17
  - id: EEF-CVE-2026-95105
    package: cloak
    reason: "No fixed cloak release exists; not a gate failure today, listed so the decision is recorded"
    review_by: 2026-12-17
